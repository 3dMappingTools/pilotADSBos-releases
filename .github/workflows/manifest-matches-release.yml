# Does latest.json actually describe the newest published release?
#
# WHY THIS EXISTS
# ---------------
# latest.json sat on 0.24.44 for a WEEK while nine releases were built, tested
# and published past it. Nothing errored, and nothing could have: a stale
# manifest is perfectly valid JSON describing a real, installable release. The
# app reads only latest.json -- correctly, it is the published contract -- so
# the staleness was silent for every customer simultaneously. It was found by
# accident, because someone happened to know a newer version existed.
#
# There is a script for this (tools/verify-publish.sh in the OS repo), but a
# script is a HABIT, and habits do not survive six quiet months or a change of
# hands. Tim, 2026-08-19: "What if we go six months with no update, and then we
# finally push one out?" Exactly right -- by then nobody remembers the script.
# So the check runs here, where publishing happens, and nobody has to remember
# anything.
#
# It runs on three triggers so no single lapse hides a stale manifest:
#   - a release is published        (the moment it can go wrong)
#   - latest.json is pushed         (catches a bad edit immediately)
#   - weekly                        (catches everything the other two missed,
#                                    including a release published while the
#                                    workflow was broken or disabled)
name: manifest matches release

on:
  release:
    types: [published, edited]
  push:
    paths: ['latest.json', 'ota/**']
  schedule:
    - cron: '17 13 * * 1'   # Mondays, 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The file in the repo, NOT the raw URL: raw.githubusercontent.com serves
      # Cache-Control max-age=300 through a CDN, and a stale edge copy has
      # already made this look fixed once when it was not.
      - name: there is EXACTLY ONE latest.json
        run: |
          # A second copy is not a duplicate, it is a SECOND SOURCE OF TRUTH that
          # drifts silently. One really existed at pilotadsbos/latest.json: last
          # updated 2026-08-11, frozen at 0.24.44 while the root file moved on to
          # 0.24.56 -- and the BYOD download page was reading THAT one, so the
          # website advertised a version a week older than the app did. Its own
          # code comment claimed both read "the SAME manifest". They did not.
          n=$(find . -name latest.json -not -path './.git/*' | tee /dev/stderr | wc -l)
          if [ "$n" -ne 1 ]; then
            echo "FAIL  found $n latest.json files; there must be exactly ONE, at the repo root."
            exit 1
          fi
          [ -f ./latest.json ] || { echo "FAIL  the single latest.json is not at the repo root"; exit 1; }
          echo "OK    exactly one manifest, at the root"

      - name: latest.json is valid and self-consistent
        run: |
          python3 - <<'PY'
          import json, os, sys, hashlib
          fail = []
          d = json.load(open('latest.json'))

          if d.get('product') != 'pilotADSBos':
              fail.append(f"product is {d.get('product')!r}, want 'pilotADSBos' "
                          "(mismatch is fail-closed and SILENT in the app)")

          t1, t2 = d.get('tier1') or {}, d.get('tier2') or {}
          v1, v2 = t1.get('version'), t2.get('version')
          if not v1: fail.append('tier1.version missing')
          if not v2: fail.append('tier2.version missing')
          if v1 and v2 and v1 != v2:
              fail.append(f'tier1 ({v1}) and tier2 ({v2}) disagree')

          # A bumped version beside a stale sha256 installs the WRONG binary and
          # still reads correctly, so verify the bytes actually on disk.
          if v1:
              p = f'ota/{v1}/dpcore-arm64'
              if not os.path.exists(p):
                  fail.append(f'{p} does not exist, but tier1.version says {v1}')
              else:
                  h = hashlib.sha256(open(p,'rb').read()).hexdigest()
                  if h != t1.get('sha256'):
                      fail.append(f'{p} sha256 {h} != manifest {t1.get("sha256")} '
                                  '- receivers will REFUSE this update')
                  size = os.path.getsize(p)
                  if size != t1.get('size'):
                      fail.append(f'{p} is {size} bytes, manifest says {t1.get("size")}')
              if v1 not in (t1.get('url') or ''):
                  fail.append(f'tier1.url does not point inside {v1}: {t1.get("url")}')
          if not t1.get('signature'):
              fail.append('tier1.signature missing - every receiver rejects the update')

          for f in fail: print(f'FAIL  {f}')
          if fail: sys.exit(1)
          print(f'OK    manifest is self-consistent at {v1}')
          PY

      # The part that would have caught the week of staleness: compare the
      # manifest against the newest release actually published here.
      #
      # GRACE PERIOD ON THE `release` TRIGGER ONLY (2026-08-26, Tim).
      # -----------------------------------------------------------
      # Publishing a release and updating latest.json are two separate acts,
      # minutes apart, in that order -- you cannot write a manifest describing an
      # asset that is not uploaded yet. So this check fired on EVERY normal
      # release, went red, and went green a couple of minutes later once the
      # manifest landed. Observed on 0.24.60 (fail 00:22, fail 00:23, pass
      # 00:25) and again on 0.24.62 (fail 12:35, pass 12:37).
      #
      # That is worse than it sounds. A guard that cries wolf on every correct
      # release is one people stop reading, and the ONE time it means something
      # it will look exactly like the ten times it did not. The failure this
      # workflow exists to catch is a manifest that stays stale for a WEEK --
      # not one that is stale for ninety seconds while a human finishes the job.
      #
      # So on `release` we WAIT and re-check, and only fail if the manifest is
      # still wrong after the window.
      #
      # 2026-08-31: `push` now gets a SHORT window too (5 min vs 30). The
      # reasoning above applied to it all along and was simply left on the other
      # trigger -- on 0.24.67 the release went live at 18:24:03, the manifest
      # was pushed at 18:25:08, and a push-triggered run inside that 90-second
      # gap went red on a correctly-handled release. Publishing is
      # release-then-push by necessity, so that would have fired on EVERY
      # release from here on.
      #
      # ⚠️ THE WEEKLY `schedule` RUN STAYS STRICT, with no window at all. That
      # is the backstop against the failure this whole workflow exists for -- a
      # manifest that is NEVER updated (latest.json sat on 0.24.44 for a WEEK).
      # A scheduled run has no publish in flight to excuse it, so a mismatch
      # there is always real. Never grant it a grace period.
      #
      # The re-read is `git show origin/main:latest.json`, not the raw URL:
      # raw.githubusercontent.com serves max-age=300 through a CDN and a stale
      # edge copy has already made this look fixed once when it was not.
      - name: manifest matches the newest published release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          latest_tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20                         --json tagName,isDraft,isPrerelease                         --jq '[.[] | select(.isDraft==false and .isPrerelease==false)][0].tagName')
          if [ -z "$latest_tag" ]; then
            echo "no published releases yet - nothing to compare"; exit 0
          fi
          echo "newest published release : $latest_tag"

          # EDITING AN OLD RELEASE SAYS NOTHING ABOUT THE CURRENT MANIFEST.
          #
          # A `release: edited` event checks out THAT RELEASE'S TAG, where
          # latest.json is -- correctly, permanently -- the version that was
          # current back then. Comparing it to today's newest release is
          # guaranteed to fail, and says nothing about what customers are being
          # offered right now.
          #
          # 2026-09-04: stripping an obsolete "Raspberry Pi Imager" line from
          # the notes of 16 old releases fired this on each one. Four went red
          # (0.24.57, 0.24.58, 0.24.60, 0.24.62) while the live manifest was
          # correct the entire time, and Tim got a run-failed email for every
          # one. That is exactly the crying-wolf failure the grace periods below
          # exist to remove -- arriving through a trigger nobody had considered.
          #
          # ⚠️ This guard CANNOT retroactively fix those four. A release event
          # runs the workflow file FROM THE TAG, so an old tag runs its own old
          # copy of this file forever. It protects tags cut from here on.
          if [ "$EVENT" = "release" ] && [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "$latest_tag" ]; then
            echo "SKIP  this event is an edit to $RELEASE_TAG, which is not the newest"
            echo "      release ($latest_tag). That tag's latest.json is a historical"
            echo "      snapshot; comparing it to today proves nothing. Not a failure."
            exit 0
          fi

          # One attempt for strict triggers; poll for 10 minutes on a release.
          if [ "$EVENT" = "release" ]; then
            # 30 min, not 10. MEASURED, not guessed: on 0.24.64 the real gap
            # between publishing the release and pushing the manifest was ~19
            # minutes -- publish, hand off, sign tier 1, push -- and a 10 min
            # window failed on a release that was being handled correctly the
            # whole time. That is the crying-wolf failure this grace period
            # exists to remove, reintroduced by picking the number optimistically.
            #
            # A longer window costs nothing in detection power. The failure being
            # guarded against is a manifest that is NEVER updated -- latest.json
            # sat on 0.24.44 for a WEEK -- and 30 minutes is no worse than 10 at
            # catching that, while being far less likely to fire on a release
            # someone is in the middle of finishing.
            tries=61; sleep_s=30
            echo "trigger=release - allowing up to 30 min for latest.json to be updated"
          elif [ "$EVENT" = "push" ]; then
            # 5 minutes on a push (2026-08-31, Tim). SHORT on purpose -- long
            # enough to cover the normal publish-then-push order, far tighter
            # than the 30 min a release gets, and it still fails fast on a push
            # that genuinely leaves the manifest stale.
            #
            # Why this was added: on 0.24.67 the release went live at 18:24:03
            # and latest.json was pushed at 18:25:08. A push-triggered run
            # landed inside that 90-second window and went red on a release
            # that was being handled correctly. That is the SAME crying-wolf
            # failure the release grace period was created to remove -- it was
            # simply left on the other trigger.
            tries=11; sleep_s=30
            echo "trigger=push - allowing up to 5 min for latest.json to be updated"
          else
            tries=1; sleep_s=0
            echo "trigger=$EVENT - strict, no grace period"
          fi

          i=1
          while [ "$i" -le "$tries" ]; do
            if [ "$i" -gt 1 ]; then
              sleep "$sleep_s"
              # Re-read from the branch, not the checkout: the manifest we are
              # waiting for is pushed AFTER this workflow started.
              git fetch -q origin main || true
              man=$(git show origin/main:latest.json 2>/dev/null                     | python3 -c "import json,sys;print(json.load(sys.stdin)['tier2']['version'])" 2>/dev/null)
            else
              man=$(python3 -c "import json;print(json.load(open('latest.json'))['tier2']['version'])")
            fi
            echo "  attempt $i/$tries - latest.json says: ${man:-<unreadable>}"
            if [ "$latest_tag" = "$man" ]; then
              echo "OK    the fleet is being offered $latest_tag"
              exit 0
            fi
            i=$((i+1))
          done

          echo
          echo "FAIL  latest.json advertises ${man:-<unreadable>} but $latest_tag is published."
          echo "      Every customer is being offered ${man:-<unreadable>} and will never hear"
          echo "      about $latest_tag. This is silent in the app - it is not an"
          echo "      error state, just an old version that looks perfectly valid."
          echo
          if [ "$EVENT" = "release" ]; then
            echo "      This waited 30 minutes for the manifest and it never arrived,"
            echo "      so this is NOT the normal publish-then-update lag."
          elif [ "$EVENT" = "push" ]; then
            echo "      This waited 5 minutes for the manifest and it never arrived,"
            echo "      so this is NOT the normal publish-then-push lag."
          fi
          echo "      Fix: update latest.json (tier1 AND tier2), then re-run."
          exit 1
